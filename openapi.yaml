openapi: 3.0.0
info:
  title: Todo List API
  version: 1.0.0
paths:
  /register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created with token
  /tasks:
    get:
      summary: List tasks for authenticated user
      security:
        - ApiTokenAuth: []
      responses:
        '200':
          description: List of tasks